name: plantmetbench
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11

  # ── PyTorch ───────────────────────────────────────────────────────────────
  # GPU build for CUDA 12.1 (A100/H100 nodes)
  # For CPU-only (laptop, no GPU): replace the two lines below with:
  #   - pytorch::pytorch=2.4.*
  #   - pytorch::cpuonly
  - pytorch::pytorch=2.4.*
  - pytorch::pytorch-cuda=12.1

  # ── Scientific stack ──────────────────────────────────────────────────────
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.4

  # ── Utilities ─────────────────────────────────────────────────────────────
  - conda-forge::requests>=2.31
  - conda-forge::tqdm

  # ── PyTorch Geometric ──────────────────────────────────────────────────────
  - pip
  - pip:
    - torch_geometric>=2.5
    # Optional CUDA extensions (uncomment if your model requires torch_scatter):
    # pip install torch_scatter torch_sparse \
    #   -f https://data.pyg.org/whl/torch-2.4.0+cu121.html

# ── Setup ─────────────────────────────────────────────────────────────────
#
#   conda env create -f environment.yml
#   conda activate plantmetbench
#
# Verify:
#   python -c "import torch, torch_geometric; \
#              print(torch.__version__, torch_geometric.__version__, \
#                    torch.cuda.is_available())"
#
# For a different CUDA version: replace pytorch-cuda=12.1 to match your driver
# (check: nvidia-smi | head -1). Common: 11.8 or 12.4.
#
# Pin the environment after adding dependencies:
#   conda env export > environment_pinned.yml
