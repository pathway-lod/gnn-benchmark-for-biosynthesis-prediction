name: plantmetbench
# Alias — identical to environment_training.yml.
# See environment_training.yml for full comments.
# See environment_data_prep.yml if you want to run the data preparation notebooks.

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch::pytorch=2.4.*
  - pytorch::pytorch-cuda=12.1
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.4
  - conda-forge::requests>=2.31
  - conda-forge::tqdm
  - pip
  - pip:
    - torch_geometric>=2.5
